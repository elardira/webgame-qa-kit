<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Atlas Demo — WebGame QA Kit</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">Synthetic test application</p>
        <h1>Atlas Outpost</h1>
      </div>
      <nav aria-label="Primary navigation">
        <a href="#dashboard" data-nav="dashboard">Dashboard</a>
        <a href="#inventory" data-nav="inventory">Inventory</a>
        <a href="#settings" data-nav="settings">Settings</a>
      </nav>
    </header>
    <main id="app" tabindex="-1"></main>
    <template id="dashboard-template">
      <section data-view="dashboard">
        <p class="eyebrow">Mission control</p>
        <h2>Dashboard</h2>
        <div class="card-grid">
          <article class="card" data-qa-card><span>Energy</span><strong data-energy></strong></article>
          <article class="card" data-qa-card><span>Credits</span><strong data-credits></strong></article>
          <article class="card" data-qa-card><span>Artifacts</span><strong data-artifacts></strong></article>
        </div>
      </section>
    </template>
    <template id="inventory-template">
      <section data-view="inventory">
        <p class="eyebrow">Recovered items</p>
        <h2>Inventory</h2>
        <div class="card-grid" data-inventory></div>
        <button type="button" data-add-item>Add synthetic sample</button>
      </section>
    </template>
    <template id="settings-template">
      <section data-view="settings">
        <p class="eyebrow">Local test state</p>
        <h2>Settings</h2>
        <article class="card settings-card" data-qa-card>
          <p>Save data remains in this browser and can be reset safely.</p>
          <button type="button" data-reset-save>Reset demo save</button>
          <output data-save-status aria-live="polite"></output>
        </article>
      </section>
    </template>
    <script type="module" src="./app.js"></script>
  </body>
</html>
