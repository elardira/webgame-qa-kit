name: Feature request
description: Propose a focused, reusable QA capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Explain a general browser-game or stateful-web-app problem without sharing private application data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What repeatable QA problem should the toolkit solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the public API, report, or command you expect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
